<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 Movie Explorer</h1>
            <p>Search for your favorite movies and get details instantly!</p>
        </header>
        <main>
            <div class="search-bar">
                <input type="text" id="movie-input" placeholder="Enter movie name...">
                <button id="search-btn">Search</button>
            </div>
            <div id="movie-details" class="movie-details">
                <!-- Movie details will be displayed here dynamically -->
                <div class="image"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
